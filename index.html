<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clearart Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600;700&display=swap');

:root{
  --bg:#080810; --panel:#10101c; --border:#1e1e30; --accent:#e2a825;
  --text:#ececec; --muted:#4a4a6a; --green:#4caf50; --red:#e05252;
  --check-a:#22222e; --check-b:#171720;
}
/* Thème clair : seules les variables changent (le canvas garde ses propres couleurs) */
/* Le damier ne s'éclaircit PAS : un clearart blanc sur fond clair serait invisible. */
body.light{--bg:#eef0f6; --panel:#ffffff; --border:#d6d9e6; --accent:#b8860b;
  --text:#1d1d2b; --muted:#7c7c99}
body.light .toast{background:#fff; color:var(--text)}
body.light .toggle button{color:var(--muted)}
body.light .toggle button.active{color:#fff}
body.light .faq-q{border-color:rgba(0,0,0,.1)}
body.light #helpOverlay kbd{background:#f0f0f8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; min-height:100vh; padding:20px 20px 60px}
#app-clearart{max-width:1320px; margin:0 auto; display:flex; flex-direction:column; gap:16px}

header{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px}
.logo{display:flex; align-items:center; gap:11px; font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:.14em; color:var(--accent)}
.logo img{width:32px; height:32px; object-fit:contain; flex:0 0 32px; filter:drop-shadow(0 1px 4px rgba(0,0,0,.4))}
.logo em{font-style:normal; color:var(--muted); font-size:11px; font-family:'Outfit',sans-serif; letter-spacing:.04em; margin-left:8px}

.head-tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.icon-btn{background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text);
  padding:8px 11px; cursor:pointer; font-size:14px; line-height:1; transition:all .15s}
.icon-btn:hover{border-color:var(--accent); color:var(--accent)}
.help-btn{background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--accent);
  padding:8px 12px; cursor:pointer; font-size:14px; line-height:1; font-weight:700; font-family:'Outfit',sans-serif}
.help-btn:hover{border-color:var(--accent)}
.m-close{width:30px; height:30px; border-radius:50%; background:var(--border); border:none; color:var(--text);
  font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 30px;
  transition:background .15s}
.m-close:hover{background:#c0392b; color:#fff}
.btn-proj{background:#6366f1; color:#fff; border:1px solid #6366f1; border-radius:10px; padding:9px 16px;
  font-family:'Outfit',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; white-space:nowrap}
.btn-proj:hover{background:#7c7ff5; border-color:#7c7ff5}

/* ══ Aperçu plein écran ══ */
#previewOverlay{position:fixed; inset:0; z-index:95; background:rgba(4,4,8,.96); display:none;
  align-items:center; justify-content:center; padding:24px 24px 56px; backdrop-filter:blur(4px)}
#previewOverlay.open{display:flex}
#previewOverlay img{max-width:100%; max-height:100%; object-fit:contain;
  filter:drop-shadow(0 24px 70px rgba(0,0,0,.8))}
#previewOverlay .m-close{position:absolute; top:18px; right:20px}
#previewOverlay .pv-note{position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  font-size:12px; color:#9a9ab4; letter-spacing:.03em}

/* ══ Modales génériques ══ */
.ov{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.75); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center; padding:24px}
.ov.open{display:flex}
.mbox{background:var(--panel); border:1px solid var(--border); border-radius:16px; width:min(820px,100%); max-height:88vh; display:flex; flex-direction:column; overflow:hidden}
.mbody{overflow-y:auto; padding:16px 18px; scrollbar-width:thin}
.mbody::-webkit-scrollbar{width:6px}
.mbody::-webkit-scrollbar-thumb{background:var(--accent); border-radius:3px}
.help-tabs{display:flex; gap:6px; margin-bottom:14px}
.help-tab{background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 14px;
  font-size:12px; font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit}
.help-tab.active{background:rgba(226,168,37,.14); border-color:var(--accent); color:var(--accent)}
.help-li{font-size:13px; color:var(--text); line-height:1.6; margin-bottom:10px}
.help-li strong{color:var(--accent)}
.faq-q{border-bottom:1px dashed rgba(255,255,255,.08); padding:8px 0}
.faq-q:last-of-type{border-bottom:none}
.faq-q summary{font-size:13px; font-weight:600; color:var(--text); cursor:pointer; user-select:none; transition:color .15s}
.faq-q summary:hover{color:var(--accent)}
.faq-q[open] summary{color:var(--accent)}
kbd{background:var(--bg); border:1px solid var(--border); border-radius:5px; padding:1px 7px;
  font-family:'Outfit',sans-serif; font-size:11px; color:var(--accent)}
.keys{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; font-size:12.5px; color:var(--text)}

/* ══ Projets ══ */
.proj-head{display:flex; align-items:center; gap:12px; padding:20px 24px 0}
.proj-head h3{font-family:'Bebas Neue',sans-serif; letter-spacing:.1em; color:var(--accent); font-size:18px; white-space:nowrap}
.proj-save{display:flex; gap:8px; padding:14px 24px 4px; flex-wrap:wrap}
.proj-save input{flex:1; min-width:180px; background:var(--bg); border:1px solid var(--border); color:var(--text);
  border-radius:8px; padding:9px 12px; font-family:inherit; font-size:13px; outline:none}
.proj-save input:focus{border-color:var(--accent)}
.pbtn{border:1px solid transparent; border-radius:8px; padding:9px 14px; font-family:'Outfit',sans-serif;
  font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:filter .15s}
.pbtn:hover{filter:brightness(1.1)}
.pbtn-gold{background:#e2a825; border-color:#e2a825; color:#1a1400}
.pbtn-indigo{background:#6366f1; border-color:#6366f1; color:#fff}

.proj-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px}
.pcard{background:var(--bg); border:1px solid var(--border); border-radius:12px; overflow:hidden; display:flex; flex-direction:column}
.pcard:hover{border-color:var(--accent)}
.pcard .pthumb{width:100%; aspect-ratio:5/1; background:#171720; display:block; object-fit:contain; cursor:pointer}
.pcard .pbody{padding:10px 11px 6px}
.pcard .pname{font-size:13px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pcard .pmeta{font-size:10.5px; color:var(--muted); margin-top:2px}
.pcard .pacts{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px 11px 11px}
.pcard .pacts button{border:none; border-radius:8px; padding:6px 0; font-size:11.5px; font-weight:600;
  cursor:pointer; font-family:'Outfit',sans-serif; color:#fff; transition:filter .15s}
.pcard .pacts button:hover{filter:brightness(1.15)}
.pa-open{background:#2b2b3d}
.pa-upd{background:#10b981}
.pa-json{background:#6366f1}
.pa-del{background:#c0392b}

.btn{background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:8px 13px; font-family:inherit; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:7px}
.btn:hover{border-color:var(--accent)}
.btn-gold{background:var(--accent); color:#000; border-color:var(--accent); font-weight:600}
.btn-gold:hover{filter:brightness(1.1)}
.btn-sm{padding:5px 9px; font-size:12px; border-radius:7px}
.btn.danger:hover{border-color:var(--red); color:var(--red)}

.grid{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; align-items:start}
@media(max-width:1180px){.grid{grid-template-columns:repeat(3, minmax(0,1fr))}}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card.wide{grid-column:span 2}
@media(max-width:760px){.card.wide{grid-column:auto}}

.stage-wrap{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px;
  display:flex; flex-direction:column; gap:10px}
.stage{position:relative; border-radius:10px; overflow:hidden; line-height:0}
.stage.checker{background-image:linear-gradient(45deg,var(--check-a) 25%,transparent 25%),linear-gradient(-45deg,var(--check-a) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--check-a) 75%),linear-gradient(-45deg,transparent 75%,var(--check-a) 75%);
  background-size:18px 18px; background-position:0 0,0 9px,9px -9px,-9px 0; background-color:var(--check-b)}
.stage canvas{width:100%; height:auto; display:block; touch-action:none}
.stage-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.stage-bar .grow{flex:1}
.ratio-ok{color:var(--green)} .ratio-warn{color:var(--accent)}

.card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:13px; display:flex; flex-direction:column; gap:10px}
.card h3{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.13em; color:var(--muted)}

.ctrl{display:flex; flex-direction:column; gap:5px}
.ctrl > label{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
.ctrl input[type="text"], .ctrl select, .ctrl input[type="number"]{
  background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px;
  padding:8px 10px; font-family:inherit; font-size:13px; outline:none; width:100%}
.ctrl input[type="text"]:focus,.ctrl select:focus{border-color:var(--accent)}
#line1, #sub{text-transform:uppercase}
.ctrl input[type="range"]{width:100%; accent-color:var(--accent); cursor:pointer}
.ctrl .row{display:flex; align-items:center; justify-content:space-between; gap:8px}
.ctrl .row .sv{color:var(--accent); font-size:12px; font-weight:600}
.check{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer}
.check input{accent-color:var(--accent)}

.toggle{display:inline-flex; border:1px solid var(--border); border-radius:9px; overflow:hidden; width:100%}
.toggle button{flex:1; background:transparent; border:none; color:var(--muted); padding:7px 8px; font-family:inherit; font-size:12px; cursor:pointer}
.toggle button.active{background:var(--accent); color:#000; font-weight:600}

.orn-list{display:flex; flex-direction:column; gap:6px}
.orn{display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:6px 8px; cursor:pointer}
.orn.sel{border-color:var(--accent)}
.orn .thumb{width:26px; height:26px; flex:0 0 26px; background:#22222e; border-radius:5px; display:grid; place-items:center}
.orn .thumb img{max-width:22px; max-height:22px}
.orn .nm{flex:1; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.orn .lay{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.empty{font-size:12px; color:var(--muted); line-height:1.5}

#drop{position:fixed; inset:0; z-index:60; background:rgba(8,8,16,.86); display:none; align-items:center; justify-content:center; pointer-events:none}
#drop.on{display:flex}
#drop div{border:2px dashed var(--accent); border-radius:20px; padding:44px 60px; background:var(--panel); font-weight:600}
.hist-btn{position:fixed; right:24px; z-index:70; background:#1a1a2e; border-radius:12px;
  padding:10px 18px; font-family:'Outfit',sans-serif; font-size:13px; font-weight:600; cursor:pointer;
  box-shadow:0 8px 32px rgba(0,0,0,.6); display:none}
#undoBtn{bottom:24px; border:1px solid rgba(226,168,37,.5); color:var(--accent)}
#redoBtn{bottom:72px; border:1px solid rgba(52,211,153,.5); color:#34d399}
.hist-btn.on{display:block}

.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:var(--panel); border:1px solid var(--accent);
  color:var(--text); padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:70}
.toast.show{opacity:1; transform:translate(-50%,0)}
.note{font-size:11.5px; color:var(--muted); line-height:1.55}

#pick-ov{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.75); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:24px}
#pick-ov.open{display:flex}
#pick{background:var(--panel); border:1px solid var(--border); border-radius:16px; width:min(880px,100%); max-height:86vh; display:flex; flex-direction:column; overflow:hidden}
.pick-head{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border)}
.pick-head .ti{font-family:'Bebas Neue',sans-serif; letter-spacing:.12em; color:var(--accent); font-size:18px}
.pick-head input{flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:8px 12px; font-family:inherit; font-size:13px; outline:none}
.pick-head input:focus{border-color:var(--accent)}
.pick-count{font-size:11.5px; color:var(--muted); white-space:nowrap}
.filt{background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:7px 10px; font-family:inherit; font-size:12.5px; outline:none; max-width:230px}
.filt:focus{border-color:var(--accent)}
.filt-bar{display:flex; align-items:center; gap:10px; padding:11px 16px 3px; flex-wrap:wrap}
.filt-bar .grow{flex:1}
.icard img.ico{width:42px; height:42px; object-fit:contain}
.pick-msg{grid-column:1/-1; text-align:center; color:var(--muted); font-size:12.5px; padding:24px 0; line-height:1.6}
.filt-bar label{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted)}

.chips.genres{padding:0; gap:5px}
.chips.genres::before{content:none}
.genres .chip{padding:5px 9px; font-size:11px}
#themeInput{background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px;
  padding:8px 10px; font-family:inherit; font-size:13px; outline:none; flex:1; min-width:0}
#themeInput:focus{border-color:var(--accent)}

.fontbtn{width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:8px;
  padding:8px 10px; font-family:inherit; font-size:13px; cursor:pointer; text-align:left}
.fontbtn:hover{border-color:var(--accent)}
.fontbtn .caret{color:var(--muted); font-size:10px}
#font-ov{position:fixed; inset:0; z-index:85; background:rgba(0,0,0,.75); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:24px}
#font-ov.open{display:flex}
#fontbox{background:var(--panel); border:1px solid var(--border); border-radius:16px; width:min(760px,100%); max-height:88vh; display:flex; flex-direction:column; overflow:hidden}
.frows{flex:1; overflow-y:auto; padding:8px 10px; scrollbar-width:thin}
.frows::-webkit-scrollbar{width:6px}
.frows::-webkit-scrollbar-thumb{background:var(--accent); border-radius:3px}
.frow{width:100%; display:flex; align-items:center; gap:14px; background:transparent; border:1px solid transparent;
  border-radius:10px; padding:9px 12px; cursor:pointer; text-align:left;
  content-visibility:auto; contain-intrinsic-size:auto 58px}
.frow:hover{background:var(--bg); border-color:var(--border)}
.frow.on{border-color:var(--accent)}
.fprev{flex:1; color:var(--text); font-size:30px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fmeta{flex:0 0 auto; text-align:right; display:flex; flex-direction:column; gap:2px}
.fmeta b{font-family:'Outfit',sans-serif; font-weight:400; font-size:11.5px; color:var(--muted)}
.tag{font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.tag.off{color:var(--green)}
.tag.usr{color:var(--accent)}
.fdel{flex:0 0 auto; color:var(--muted); font-size:13px; padding:2px 6px; border-radius:5px; cursor:pointer}
.fdel:hover{color:var(--red); background:var(--bg)}
.chips{display:flex; gap:6px; flex-wrap:wrap; padding:12px 16px 4px; align-items:center}
.chip{background:var(--bg); border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:5px 11px; font-size:11.5px; cursor:pointer; font-family:inherit}
.chip.active{background:var(--accent); color:#000; border-color:var(--accent); font-weight:600}
.pick-grid{flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; padding:14px 16px; scrollbar-width:thin}
.pick-grid::-webkit-scrollbar{width:6px}
.pick-grid::-webkit-scrollbar-thumb{background:var(--accent); border-radius:3px}
.pick-more{grid-column:1/-1; display:flex; justify-content:center; padding:14px 0}
.spinner{width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent);
  border-radius:50%; animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.icard{content-visibility:auto; contain-intrinsic-size:auto 96px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 6px 7px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer}
.icard:hover{border-color:var(--accent)}
.icard img{width:42px; height:42px; object-fit:contain}
.icard span{font-size:10.5px; color:var(--muted); text-align:center; line-height:1.25}
.pick-foot{border-top:1px solid var(--border); padding:11px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.pick-foot .note{flex:1; min-width:240px}
.note a{color:var(--accent)}
#helpOverlay a, .help-li a{color:var(--accent); text-decoration:underline; text-underline-offset:2px}
#helpOverlay a:hover, .help-li a:hover{filter:brightness(1.2)}
</style>
</head>
<body>

<div id="app-clearart"></div>
<button class="hist-btn" id="undoBtn" data-act="undo" title="Annuler (Ctrl+Z)">↶ Annuler</button>
<button class="hist-btn" id="redoBtn" data-act="redo" title="Rétablir (Ctrl+Y)">↷ Rétablir</button>

<div id="drop"><div>Déposez une image d'icône, ou une police (.ttf, .otf, .woff)</div></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   Clearart Maker — module JukeBoX
   Contrat : id / name / needs / mount / activate / deactivate / onKey
   Aucun onclick inline : délégation via [data-act].
   ══════════════════════════════════════════════════════════════ */
const ClearartMaker = (function(){

/* ─── Constantes ─── */
const W = 2200, H = 800;              // canevas de travail (haute résolution)
const ALPHA_THRESHOLD = 8;            // ignore l'antialiasing quasi transparent
/* Polices : plus aucune embarquée, tout passe par Google Fonts (chargement à la demande). */
const EMB = {};

/* Polices par genre — les 18 genres classiques, dans l'ordre alphabétique français. */

let root, cv, ctx, raf=null;

function toggleTheme(){
  const light = document.body.classList.toggle('light');
  try{ localStorage.setItem('cam_theme', light ? 'light' : 'dark'); }catch(e){}
  const b = root.querySelector('#themeBtn');
  if(b) b.textContent = light ? '☀️' : '🌙';
}
function applyStoredTheme(){
  let light = false;
  try{ light = localStorage.getItem('cam_theme') === 'light'; }catch(e){}
  document.body.classList.toggle('light', light);
  const b = root.querySelector('#themeBtn');
  if(b) b.textContent = light ? '☀️' : '🌙';
}

function togglePreview(){
  const ov = document.getElementById('previewOverlay');
  if(ov.classList.contains('open')){ ov.classList.remove('open'); return; }
  render();
  const o = S.template ? renderTemplate() : (()=>{
    const b = exportBox(); if(!b) return null;
    const c = document.createElement('canvas'); c.width=b.w; c.height=b.h;
    c.getContext('2d').drawImage(cv, b.x,b.y,b.w,b.h, 0,0,b.w,b.h);
    return c;
  })();
  if(!o){ toast('Rien à prévisualiser'); return; }
  document.getElementById('pvImg').src = o.toDataURL('image/png');
  document.getElementById('pvNote').textContent = `${o.width} × ${o.height} px — fond transparent`;
  ov.classList.add('open');
}

const deburr = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* La recherche d'Iconify est anglophone : le dictionnaire fait la traduction.
   « épée » → sword, « braquage » → strongbox, « chauve-souris » → bat. */
function toEnglish(q){
  const nq = deburr(q).trim();
  if(!nq) return '';
  const sing = nq.replace(/[sx]$/,'');
  for(const k in FR){ if(k === nq || k === sing) return FR[k][0].replace(/-/g,' '); }
  for(const k in FR){ if(k.startsWith(nq) && nq.length >= 3) return FR[k][0].replace(/-/g,' '); }
  return nq;                              // pas dans le dictionnaire : on tente le mot tel quel
}

/* Les vignettes sont du SVG natif : aucun canvas, aucun toDataURL, rendu immédiat. */
/* ─── Iconify : ~200 000 icônes, cherchées en direct ───
   L'API renvoie des identifiants « prefixe:nom » ; le SVG se récupère à la demande,
   déjà colorié en blanc. Rien n'est embarqué : le fichier ne grossit pas d'un octet. */
const ICONIFY = 'https://api.iconify.design';
let icoSeq = 0;
const iconBodyCache = new Map();  // "prefix:nom" -> {body, width, height, left, top}

async function iconifySearch(q){
  const en  = toEnglish(q);
  const url = `${ICONIFY}/search?query=${encodeURIComponent(en)}&limit=120`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('http '+r.status);
  const d = await r.json();
  return { icons: d.icons || [], en };
}

/* Regroupe les icônes par collection pour ne faire qu'un appel JSON par collection
   (au lieu d'une requête image par icône), et met les tracés en cache. L'endpoint
   image .svg d'Iconify est trop souvent bloque par leur pare-feu quand on charge
   une grille entière d'icônes d'un coup ; l'API JSON, elle, reste accessible. */
async function ensureIconData(ids){
  const byPrefix = new Map();
  for(const id of ids){
    if(iconBodyCache.has(id)) continue;
    const [prefix, name] = id.split(':');
    if(!byPrefix.has(prefix)) byPrefix.set(prefix, []);
    byPrefix.get(prefix).push(name);
  }
  await Promise.all([...byPrefix.entries()].map(async ([prefix, names])=>{
    try{
      const url = `${ICONIFY}/${prefix}.json?icons=${names.map(encodeURIComponent).join(',')}`;
      const r = await fetch(url);
      if(!r.ok) return;
      const d = await r.json();
      const dw = d.width || 24, dh = d.height || 24;
      for(const name of Object.keys(d.icons || {})){
        const ic = d.icons[name];
        iconBodyCache.set(`${prefix}:${name}`, {
          body: ic.body, width: ic.width || dw, height: ic.height || dh,
          left: ic.left || 0, top: ic.top || 0,
        });
      }
    }catch(e){ console.error(e); }
  }));
}

function iconSVGMarkup(id, color){
  const d = iconBodyCache.get(id);
  if(!d) return null;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${d.left} ${d.top} ${d.width} ${d.height}" fill="${color}">${d.body}</svg>`;
}
const iconDataURI = (id, color) => {
  const svg = iconSVGMarkup(id, color);
  return svg ? `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}` : '';
};

/* Le SVG est reconstruit en pleine résolution, normalisé, blanchi, rogné. */
async function addIconifyIcon(id){
  try{
    await ensureIconData([id]);
    const svg = iconSVGMarkup(id, '#ffffff');
    if(!svg) throw new Error('icône introuvable : '+id);
    const img = await decodeSVGText(svg);
    addOrnament(whiten(trimImage(imgToCanvas(img))), id.split(':')[1] || id);
    closePicker();
    toast(id.replace(':', ' · '));
  }catch(e){ console.error(e); toast('Icône Iconify indisponible'); }
}

async function renderIconify(){
  const grid  = root.querySelector('#pickGrid');
  const count = root.querySelector('#pickCount');
  const seq   = ++icoSeq;
  if(!pickQ.trim()){
    count.textContent = '~200 000 icônes';
    grid.innerHTML = '<div class="pick-msg">Tapez un mot — en français — pour chercher parmi ~200 000 icônes.<br>La requête est traduite automatiquement.</div>';
    return;
  }
  count.textContent = '…';
  grid.innerHTML = '<div class="pick-msg"><span class="spinner"></span></div>';
  try{
    const {icons, en} = await iconifySearch(pickQ);
    if(seq !== icoSeq) return;                       // une frappe plus récente a pris la main
    count.textContent = `${icons.length} résultat${icons.length>1?'s':''}`;
    if(!icons.length){
      grid.innerHTML = `<div class="pick-msg">Aucune icône pour « ${esc(en)} ».</div>`;
      return;
    }
    await ensureIconData(icons);
    if(seq !== icoSeq) return;                       // idem après le chargement des traces
    grid.innerHTML = icons.map(id=>{
      const uri = iconDataURI(id, '#ffffff');
      return uri ? `<button class="icard" data-ico="${esc(id)}" title="${esc(id)}">
         <img class="ico" src="${uri}" alt="" loading="lazy">
         <span>${esc((id.split(':')[1]||id).replace(/-/g,' '))}</span>
       </button>` : '';
    }).join('');
  }catch(e){
    if(seq !== icoSeq) return;
    console.error(e);
    count.textContent = '—';
    grid.innerHTML = '<div class="pick-msg">Iconify est injoignable.<br>Vérifiez votre connexion, puis relancez la recherche.</div>';
  }
}

function renderPicker(){ renderIconify(); }

  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

const fontDone = new Set();
const USER = new Map();                 // nom → true, polices importées et enregistrées

/* ─── Polices importées : FontFace + IndexedDB ─── */
const FDB = 'clearart-maker';
let _fdb = null;
function fdb(){
  if(_fdb) return Promise.resolve(_fdb);
  return new Promise((res, rej)=>{
    const r = indexedDB.open(FDB, 2);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('fonts'))    d.createObjectStore('fonts',    {keyPath:'name'});
      if(!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', {keyPath:'id'});
    };
    r.onsuccess = e => { _fdb = e.target.result; res(_fdb); };
    r.onerror   = () => rej(r.error);
  });
}
const idbReq = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });

async function storeFont(name, buf){
  const d = await fdb();
  const t = d.transaction('fonts','readwrite');
  t.objectStore('fonts').put({name, buf});
  return new Promise((res,rej)=>{ t.oncomplete=res; t.onerror=()=>rej(t.error); });
}
async function loadStoredFonts(){
  try{
    const d = await fdb();
    const all = await idbReq(d.transaction('fonts','readonly').objectStore('fonts').getAll());
    for(const f of all) await registerFont(f.name, f.buf, false);
  }catch(e){ console.error(e); }
}
async function dropFont(name){
  const d = await fdb();
  const t = d.transaction('fonts','readwrite');
  t.objectStore('fonts').delete(name);
  await new Promise(res=>{ t.oncomplete = res; });
  USER.delete(name);
  document.fonts.forEach(ff=>{ if(ff.family === name) document.fonts.delete(ff); });
  fontDone.delete(name);
}

/* Un .ttf, .otf, .woff ou .woff2 se charge tel quel : aucune conversion. */
async function registerFont(name, buf, persist){
  const ff = new FontFace(name, buf);
  await ff.load();
  document.fonts.add(ff);
  USER.set(name, true);
  fontDone.add(name);
  if(persist) await storeFont(name, buf);
}

/* Le nom de fichier devient le nom de famille. En cas de collision avec le
   catalogue, on suffixe : deux familles homonymes seraient indépartageables en CSS. */
function fontNameFor(filename){
  let n = filename.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim() || 'Police importée';
  const taken = f => EMB[f] || USER.has(f) || FONT_INDEX.some(([x])=>x===f);
  if(taken(n)){ let i = 2; while(taken(n+' '+i)) i++; n = n+' '+i; }
  return n;
}

async function addFontFile(file){
  try{
    const name = fontNameFor(file.name);
    await registerFont(name, await file.arrayBuffer(), true);
    inkCache.key = null;
    await chooseFont(name);
    toast('Police « '+name+' » importée');
  }catch(e){ console.error(e); toast('Police illisible (.ttf, .otf, .woff, .woff2)'); }
}
const isFontFile = f => /\.(ttf|otf|woff2?)$/i.test(f.name) || /font/.test(f.type);

/* Embarquée → FontFace depuis le base64. Sinon → feuille Google Fonts. */
async function loadFont(fam){
  if(fontDone.has(fam) || USER.has(fam)) return;
  try{
    if(EMB[fam]){
      const ff = new FontFace(fam, `url(data:font/woff2;base64,${EMB[fam]}) format("woff2")`);
      await ff.load();
      document.fonts.add(ff);
    } else {
      const id = 'gf-' + fam.replace(/\s+/g,'-');
      let l = document.getElementById(id);
      if(!l){
        l = document.createElement('link'); l.id = id; l.rel = 'stylesheet';
        l.href = 'https://fonts.googleapis.com/css2?family=' + fam.replace(/\s+/g,'+') + '&display=swap';
        const linkReady = new Promise(res => { l.onload = res; l.onerror = res; });
        document.head.appendChild(l);
        await linkReady;   // le stylesheet (et donc la règle @font-face) doit être en place avant de demander le chargement
      }
      await document.fonts.load(`400 100px "${fam}"`);
    }
  }catch(e){ /* la police reste en repli, on ne bloque pas le rendu */ }
  fontDone.add(fam);
  inkCache.key = null;   // la boîte d'encre mesurée avec la police de repli est périmée
}

/* Récupère un SVG Iconify par identifiant complet, le blanchit, le pose comme icône. */
async function fetchIconify(id, label){
  await ensureIconData([id]);
  const svg = iconSVGMarkup(id, '#ffffff');
  if(!svg) throw new Error('icône introuvable : '+id);
  const img = await decodeSVGText(svg);
  addOrnament(whiten(trimImage(imgToCanvas(img))), label || id.split(':')[1] || id);
}

async function applyTheme(t){

  pickQ = t;

  openPicker();

/* ─────────── Historique ───────────
   Un instantané = les réglages plus une référence vers le canvas de l'icône.
   Le canvas n'est jamais copié : il est immuable une fois rasterisé. */
const HIST = { past: [], future: [], lock: false, max: 60 };
let CUR = null;

function snapshot(){
  const st = {};
  PROJ_KEYS.forEach(k => st[k] = S[k]);
  const o = S.orn[0];
  return { st, icon: o ? {img:o.img, name:o.name} : null };
}

function histUI(){
  const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
  if(u) u.classList.toggle('on', HIST.past.length > 0);
  if(r) r.classList.toggle('on', HIST.future.length > 0);
}

/* Appelé APRÈS chaque modification : on archive l'état précédent. */
function commit(){
  if(HIST.lock) return;
  if(CUR){
    HIST.past.push(CUR);
    if(HIST.past.length > HIST.max) HIST.past.shift();
    HIST.future.length = 0;
  }
  CUR = snapshot();
  histUI();
}

function syncAll(){
  root.querySelector('#line1').value = S.line1;
  root.querySelector('#sub').value   = S.sub;
  root.querySelector('#fontCur').textContent = S.font;
  root.querySelector('#fontCur2').textContent = S.subFont;
  root.querySelector('#template').checked = S.template;
  ['size','ls','vscale','leading','bold','margin','iconPct','gapPct','iconX','subScale','ratio','capFrac','rot','targetW']
    .forEach(k=>{ const el = root.querySelector('#'+k); if(el) el.value = S[k]; });
  root.querySelectorAll('#lineToggle button').forEach(b=>b.classList.toggle('active', +b.dataset.lines === S.lines));
  root.querySelector('#l2ctrl').style.display   = S.lines === 2 ? '' : 'none';
  root.querySelector('#l2fontctrl').style.display = S.lines === 2 ? '' : 'none';
  root.querySelector('#l1lab').textContent      = S.lines === 2 ? 'Ligne 1' : 'Libellé';
  syncTemplateUI(); syncIconUI(); syncLabels();
  loadFont(S.font); loadFont(S.subFont);
}

/* Restaure police, taille, interlettrage, épaisseur, icône et réglages fins à leurs valeurs
   d'origine — le contenu (texte, genre choisi) et les réglages d'export ne sont pas touchés. */
async function resetStyleDefaults(){
  Object.assign(S, DEFAULT_STYLE);
  syncAll();
  inkCache.key = null;
  await loadFont(S.font);
  await loadFont(S.subFont);
  scheduleRender();
  commit();
  toast('↺ Valeurs par défaut restaurées');
}

function restore(sn){
  HIST.lock = true;
  Object.assign(S, sn.st);
  S.orn = sn.icon ? [{ img:sn.icon.img, name:sn.icon.name, x:0, y:0, h:320 }] : [];
  inkCache.key = null;
  syncAll();
  scheduleRender();
  HIST.lock = false;
}

function undo(){
  if(!HIST.past.length){ toast('Rien à annuler'); return; }
  HIST.future.push(CUR);
  CUR = HIST.past.pop();
  restore(CUR); histUI();
}
function redo(){
  if(!HIST.future.length){ toast('Rien à rétablir'); return; }
  HIST.past.push(CUR);
  CUR = HIST.future.pop();
  restore(CUR); histUI();
}

/* ─────────── Projets ───────────
   Un projet = l'état complet + l'icône en PNG. L'icône est embarquée : sans elle,
   rouvrir un projet dont l'ornement venait d'un import serait impossible. */
const PROJ_KEYS = ['line1','sub','lines','subScale','font','subFont','size','ls','vscale','leading','bold',
                   'iconPct','gapPct','iconX','rot','template','ratio','capFrac','margin','targetW'];

function buildProject(name){
  const p = { id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
              app:'clearart-maker', version:1, name, ts:Date.now(), settings:{} };
  PROJ_KEYS.forEach(k=> p.settings[k] = S[k]);
  const o = S.orn[0];
  p.icon = o ? { name:o.name, data:o.img.toDataURL('image/png') } : null;
  p.thumb = makeThumb();
  return p;
}

/* Vignette : l'export réel, réduit à 260 px de large. */
function makeThumb(){
  try{
    render();
    const src = S.template ? renderTemplate() : cv;
    if(!src) return null;
    const w = 260, h = Math.max(1, Math.round(src.height * w / src.width));
    const c = document.createElement('canvas'); c.width=w; c.height=h;
    const x = c.getContext('2d'); x.imageSmoothingQuality='high';
    x.drawImage(src, 0,0,w,h);
    return c.toDataURL('image/png');
  }catch(e){ return null; }
}

  root.querySelector('#line1').value = S.line1;

  const wanted = S.lines;            // setLines() efface S.sub en mode 1 ligne
  setLines(wanted);
  if(wanted === 2){ S.sub = p.settings.sub; root.querySelector('#sub').value = S.sub; }
  root.querySelector('#fontCur').textContent = S.font;
  root.querySelector('#fontCur2').textContent = S.subFont;

  root.querySelector('#template').checked   = S.template;
  ['size','ls','vscale','leading','bold','margin','iconPct','gapPct','iconX','subScale','ratio','capFrac','rot','targetW']
    .forEach(k=> root.querySelector('#'+k).value = S[k]);
  await loadFont(S.font);

/* ─── Ornements : préparation du SVG ───
   game-icons.net pose un rectangle noir plein écran en premier chemin :
   on le retire, puis on force tout le tracé en blanc. */
function normalizeSVG(text){
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const svg = doc.querySelector('svg');
  if(!svg) throw new Error('svg');
  svg.querySelectorAll('path').forEach(p=>{
    const d = (p.getAttribute('d')||'').replace(/\s+/g,'');
    if(/^M0,?0h\d+v\d+H0z$/i.test(d)) p.remove();       // fond opaque
  });
  svg.querySelectorAll('style').forEach(el=>el.remove());   // .cls-1{fill:#000} et consorts
  svg.querySelectorAll('[class]').forEach(el=>el.removeAttribute('class'));
  svg.querySelectorAll('[fill],[stroke],[style]').forEach(el=>{
    el.removeAttribute('style');
    if(el.hasAttribute('fill') && el.getAttribute('fill')!=='none') el.setAttribute('fill','#ffffff');
    if(el.hasAttribute('stroke') && el.getAttribute('stroke')!=='none') el.setAttribute('stroke','#ffffff');
  });
  svg.setAttribute('fill','#ffffff');
  if(!svg.getAttribute('viewBox') && svg.getAttribute('width')){
    svg.setAttribute('viewBox', `0 0 ${parseFloat(svg.getAttribute('width'))} ${parseFloat(svg.getAttribute('height'))}`);
  }
  const vb = (svg.getAttribute('viewBox')||'0 0 512 512').split(/[\s,]+/).map(Number);
  const side = 900;
  svg.setAttribute('width', side); svg.setAttribute('height', Math.round(side*vb[3]/vb[2]));
  return new XMLSerializer().serializeToString(svg);
}

function decodeSVGText(text){
  const clean = normalizeSVG(text);
  const url = URL.createObjectURL(new Blob([clean], {type:'image/svg+xml'}));
  return decodeURL(url).finally(()=>URL.revokeObjectURL(url));
}
function decodeURL(url){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
}

/* Seuil d'Otsu : sépare deux populations de pixels en maximisant leur variance
   inter-classe. Aucun réglage à deviner — le seuil sort de l'image elle-même. */
function otsu(hist, total){
  let sum = 0;
  for(let i=0;i<256;i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = 0, t = 0;
  for(let i=0;i<256;i++){
    wB += hist[i];
    if(!wB) continue;
    const wF = total - wB;
    if(!wF) break;
    sumB += i * hist[i];
    const diff = sumB/wB - (sum - sumB)/wF;
    const v = wB * wF * diff * diff;
    if(v > best){ best = v; t = i; }
  }
  return t;
}

/* Une image plate — JPEG de logo noir sur blanc, ou l'inverse — n'a pas d'alpha.
   On en fabrique un à partir de l'écart de luminance au fond, avec un seuil calculé :
   un seuil fixe ramasserait le bruit de compression du JPEG. */
function inkFromOpaque(c){
  const x = c.getContext('2d', {willReadFrequently:true});
  const img = x.getImageData(0,0,c.width,c.height), p = img.data;
  const n = p.length/4;
  let opaque = 0;
  for(let i=3;i<p.length;i+=4) if(p[i] > 250) opaque++;
  if(opaque / n < 0.9) return false;                   // déjà détouré : on ne touche à rien

  const lum = i => 0.2126*p[i] + 0.7152*p[i+1] + 0.0722*p[i+2];
  const w = c.width, h = c.height;
  const corners = [0, (w-1)*4, (h-1)*w*4, ((h-1)*w + w-1)*4].map(lum).sort((a,b)=>a-b);
  const bg = (corners[1] + corners[2]) / 2;            // médiane : un coin parasite ne décide pas

  const dist = new Uint8Array(n), hist = new Uint32Array(256);
  for(let i=0, k=0; i<p.length; i+=4, k++){
    const d = Math.min(255, Math.abs(lum(i) - bg)) | 0;
    dist[k] = d; hist[d]++;
  }
  // Rampe RELATIVE au seuil : « t - r » deviendrait négatif sur un histogramme
  // très bimodal (t proche de 0) et redonnerait de l'alpha au fond.
  const t  = otsu(hist, n);
  const lo = Math.max(1, t * 0.75);
  const hi = Math.max(lo + 6, t * 1.25);               // largeur plancher : bords antialiasés préservés
  const k255 = 255 / (hi - lo);
  for(let i=3, k=0; i<p.length; i+=4, k++){
    p[i] = Math.max(0, Math.min(255, (dist[k] - lo) * k255));
  }
  x.putImageData(img, 0, 0);
  return true;
}

/* Repeint en blanc pur en ne gardant que la silhouette : « source-in » conserve
   l'alpha existant, donc l'antialiasing des bords survit intact. */
function whiten(c){
  const x = c.getContext('2d');
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = '#ffffff';
  x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = 'source-over';
  return c;
}

function imgToCanvas(img){
  const c = document.createElement('canvas');
  c.width  = img.naturalWidth  || img.width;
  c.height = img.naturalHeight || img.height;
  c.getContext('2d', {willReadFrequently:true}).drawImage(img, 0, 0);
  return c;
}

/* Rogne l'image sur ses pixels non transparents → placement prévisible. */
function trimImage(img){
  const c = document.createElement('canvas');
  c.width = img.naturalWidth||img.width; c.height = img.naturalHeight||img.height;
  const x = c.getContext('2d'); x.drawImage(img,0,0);
  const b = inkBox(c);
  if(!b) return c;
  const o = document.createElement('canvas'); o.width=b.w; o.height=b.h;
  o.getContext('2d').drawImage(c, b.x,b.y,b.w,b.h, 0,0,b.w,b.h);
  return o;
}

function inkBox(c, thr){
  thr = thr===undefined ? ALPHA_THRESHOLD : thr;
  const w=c.width, h=c.height;
  const d = c.getContext('2d').getImageData(0,0,w,h).data;
  let x0=w, y0=h, x1=-1, y1=-1;
  for(let y=0;y<h;y++){
    const row=y*w;
    for(let x=0;x<w;x++){
      if(d[(row+x)*4+3] > thr){
        if(x<x0)x0=x; if(x>x1)x1=x;
        if(y<y0)y0=y; if(y>y1)y1=y;
      }
    }
  }
  if(x1<0) return null;
  return {x:x0, y:y0, w:x1-x0+1, h:y1-y0+1};
}

/* ─── Import .ai (fichier vectoriel Illustrator) ───
   Un .ai récent (Illustrator CS/CC) est en réalité un PDF valide en interne : on le
   rend via pdf.js — chargé à la demande, pas embarqué — et on récupère la première
   page comme source image, exactement comme pour un SVG importé. */
let pdfjsLoading = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsLoading) return pdfjsLoading;
  pdfjsLoading = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    s.onerror = () => { pdfjsLoading = null; reject(new Error('Lecteur .ai indisponible (hors ligne ?)')); };
    document.head.appendChild(s);
  });
  return pdfjsLoading;
}

async function decodeAIFile(file){
  const pdfjsLib = await loadPdfJs();
  const buf  = await file.arrayBuffer();
  const doc  = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await doc.getPage(1);
  const base = page.getViewport({ scale: 1 });
  const scale = Math.min(4, Math.max(1, 1600 / Math.max(base.width, base.height)));
  const viewport = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width  = Math.ceil(viewport.width);
  c.height = Math.ceil(viewport.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport }).promise;
  return c;
}

async function addOrnamentFile(file){
  try{
    let img;
    if(/svg/.test(file.type) || /\.svg$/i.test(file.name)){
      img = await decodeSVGText(await file.text());
    } else if(/\.ai$/i.test(file.name)){
      img = await decodeAIFile(file);
    } else if(/^image\//.test(file.type)){
      const url = URL.createObjectURL(file);
      img = await decodeURL(url); URL.revokeObjectURL(url);
    } else { toast('Fichier non pris en charge'); return; }

    const raw     = imgToCanvas(img);
    const cutout  = inkFromOpaque(raw);       // fond plat détecté → alpha reconstruit
    const canvasImg = whiten(trimImage(raw)); // silhouette en blanc pur

    addOrnament(canvasImg, file.name.replace(/\.[^.]+$/,''));
    closePicker();                          // on rend la vue au canevas
    toast(cutout ? 'Icône importée — fond détecté et retiré' : 'Icône importée');
  }catch(e){ console.error(e); toast(e && e.message ? e.message : 'Image illisible'); }
}

/* ─── Dessin ─── */

function fontAt(px, fam){ return `400 ${px}px "${fam || S.font}", serif`; }

const lsPad = c => ('letterSpacing' in c) ? S.ls : 0;   // le dernier caractère traîne un espacement
const lines = () => (S.lines === 2 && S.sub.trim()) ? [S.line1, S.sub] : [S.line1];
const lead  = () => S.size * (S.leading/100);

/* ─── Mesure ANALYTIQUE de la boîte d'encre ───
   measureText().actualBoundingBox* donne l'encre réelle sans rasteriser :
   aucune limite de taille, donc rien ne peut « déborder du canevas » sans qu'on le voie.
   Coordonnées locales, origine au centre du bloc de texte. */
function lineInk(c, line, px, y, fam){
  if(!line.trim()) return null;
  c.font = fontAt(px, fam);
  c.textAlign = 'left'; c.textBaseline = 'middle';
  if('letterSpacing' in c) c.letterSpacing = S.ls+'px';
  const m  = c.measureText(line);
  const x0 = -(m.width - lsPad(c))/2;
  return {
    l: x0 - m.actualBoundingBoxLeft,  r: x0 + m.actualBoundingBoxRight,
    t: y  - m.actualBoundingBoxAscent, b: y + m.actualBoundingBoxDescent
  };
}

/* Boîte d'encre du texte entier, échelle verticale comprise. capH = hauteur de la ligne 1. */
function textInk(){
  const key = [S.line1,S.sub,S.lines,S.subScale,S.font,S.subFont,S.size,S.ls,S.vscale,S.leading].join('|');
  if(inkCache.key === key) return inkCache.box;
  const c = sctx; c.save();
  const ls = lines(), lg = lead();
  let box = null, capH = 0;
  ls.forEach((ln, li)=>{
    const px = li===1 ? S.size*S.subScale/100 : S.size;
    const y  = (li - (ls.length-1)/2) * lg;
    const b  = lineInk(c, ln, px, y, li===1 ? S.subFont : S.font);
    if(!b) return;
    if(li===0) capH = b.b - b.t;
    box = box ? {l:Math.min(box.l,b.l), r:Math.max(box.r,b.r), t:Math.min(box.t,b.t), b:Math.max(box.b,b.b)} : b;
  });
  c.restore();
  if(!box){ inkCache = {key, box:null}; return null; }
  const vs = S.vscale/100;
  const out = {x:box.l, y:box.t*vs, w:box.r-box.l, h:(box.b-box.t)*vs, cap:capH*vs};
  inkCache = {key, box: out};
  return out;
}

/* Trace le texte en coordonnées locales (origine = centre du bloc).
   La ligne est dessinée d'un bloc : le crénage et les ligatures sont préservés. */
function paintText(c){
  const ls = lines(), lg = lead(), lw = S.bold * 2;
  c.save();
  c.textAlign='left'; c.textBaseline='middle';
  c.fillStyle='#fff'; c.strokeStyle='#fff'; c.lineJoin='round'; c.lineCap='round';
  c.scale(1, S.vscale/100);
  ls.forEach((ln, li)=>{
    const px = li===1 ? S.size*S.subScale/100 : S.size;
    c.font = fontAt(px, li===1 ? S.subFont : S.font);
    if('letterSpacing' in c) c.letterSpacing = S.ls+'px';
    const y  = (li - (ls.length-1)/2) * lg;
    const x0 = -(c.measureText(ln).width - lsPad(c))/2;
    if(lw > 0){ c.lineWidth = lw; c.strokeText(ln, x0, y); }
    c.fillText(ln, x0, y);
  });
  c.restore();
}

/* ─────────── Placement ───────────
   Icône centrée au-dessus du mot. Hauteur et écart sont exprimés en pourcentage
   de la hauteur de capitale : la composition reste proportionnée à toute taille. */
const iconAspect = o => o.img.width / o.img.height;

function applyLayout(){
  // Icône seule : pas de texte à mesurer. On fabrique une boîte de référence
  // à partir d'une hauteur nominale, et l'icône occupe tout, centrée à l'origine.
  if(S.lines === 0){
    if(!S.orn.length) return null;
    const o = S.orn[0];
    const H0 = 500;                              // hauteur nominale ; le gabarit ré-échelonne ensuite
    o.h = H0 * S.iconPct/100;
    o.x = H0 * S.iconX/100; o.y = 0;
    return {x:-o.h*iconAspect(o)/2, y:-o.h/2, w:o.h*iconAspect(o), h:o.h, cap:o.h};
  }
  const tb = textInk();
  if(!tb) return null;
  if(S.lines === 3 || !S.orn.length) return tb;   // texte seul : pas d'icône à placer
  const o   = S.orn[0];
  const cap = tb.cap;
  const ih  = cap * S.iconPct/100;
  const rad = Math.abs(S.rot) * Math.PI/180;
  const eh  = ih*Math.abs(Math.cos(rad)) + ih*iconAspect(o)*Math.abs(Math.sin(rad));
  o.h = ih;
  o.x = tb.x + tb.w/2 + cap * S.iconX/100;   // décalage horizontal, en % de la hauteur de capitale
  o.y = tb.y - cap * S.gapPct/100 - eh/2;   // l'écart vaut pour la hauteur réellement occupée
  return tb;
}

/* Encombrement total (texte + ornements) en coordonnées locales. */
function unionBox(tb){
  let L=tb.x, R=tb.x+tb.w, T=tb.y, B=tb.y+tb.h;
  if(S.lines === 3) return {x:L, y:T, w:R-L, h:B-T};   // texte seul : l'icône n'entre pas dans le cadrage
  const rad = Math.abs(S.rot) * Math.PI/180, cs = Math.abs(Math.cos(rad)), sn = Math.abs(Math.sin(rad));
  for(const o of S.orn){
    const w = o.h * iconAspect(o), h = o.h;
    const ew = w*cs + h*sn, eh = w*sn + h*cs;   // boîte englobante du rectangle tourné
    L=Math.min(L,o.x-ew/2); R=Math.max(R,o.x+ew/2);
    T=Math.min(T,o.y-eh/2); B=Math.max(B,o.y+eh/2);
  }
  return {x:L, y:T, w:R-L, h:B-T};
}

/* Ajustement global : rien ne peut sortir du canevas de travail. */
function computeFit(tb){
  const u = unionBox(tb);
  const k = Math.min(1, (W - 2*PAD)/u.w, (H - 2*PAD)/u.h);
  FIT = { k, dx: W/2 - k*(u.x + u.w/2), dy: H/2 - k*(u.y + u.h/2), cap: tb.cap * k };
}
function paintOrnament(c, o){
  const k = o.h / o.img.height;
  c.save();
  c.translate(o.x, o.y);
  if(S.rot) c.rotate(S.rot * Math.PI/180);
  c.scale(k, k);
  c.drawImage(o.img, -o.img.width/2, -o.img.height/2);
  c.restore();
}

function render(){
  const tb = applyLayout();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  if(!tb){ updateInfo(); return; }
  computeFit(tb);
  ctx.setTransform(FIT.k, 0, 0, FIT.k, FIT.dx, FIT.dy);
  if(S.lines !== 3) S.orn.forEach(o=>paintOrnament(ctx, o));   // texte seul : icône masquée
  if(S.lines !== 0) paintText(ctx);
  ctx.setTransform(1,0,0,1,0,0);
  updateInfo();
}
function scheduleRender(){ if(raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(render); }

/* ─── Export ─── */
function exportBox(){
  const b = inkBox(cv);
  if(!b) return null;
  const m = Math.round(b.w * S.margin/100);
  return {
    x: Math.max(0, b.x-m), y: Math.max(0, b.y-m),
    w: Math.min(W, b.x+b.w+m) - Math.max(0, b.x-m),
    h: Math.min(H, b.y+b.h+m) - Math.max(0, b.y-m)
  };
}

/* Gabarit uniforme : canevas de ratio fixe, hauteur de capitale imposée,
   marges transparentes variables. Deux clearart ont alors exactement la même
   forme et la même taille de lettres — c'est ce qui garantit l'homogénéité. */
function templatePlan(){
  const b = inkBox(cv);
  if(!b || !FIT.cap) return null;
  const outW = S.targetW, outH = Math.round(outW / S.ratio);
  const ideal = (S.capFrac/100 * outH) / FIT.cap;             // échelle voulue
  const maxW  = (outW * 0.98) / b.w, maxH = (outH * 0.96) / b.h;
  const sc    = Math.min(ideal, maxW, maxH);
  // Quelle contrainte borne ? La hauteur est structurelle et identique pour tous
  // les genres ; la largeur, elle, dépend du mot — c'est la seule qui casse l'homogénéité.
  const bound = sc >= ideal - 1e-6 ? 'cap' : (maxW < maxH ? 'largeur' : 'hauteur');
  return { b, outW, outH, sc, bound, capPx: FIT.cap * sc };
}

function renderTemplate(){
  const p = templatePlan();
  if(!p) return null;
  const o = document.createElement('canvas'); o.width = p.outW; o.height = p.outH;
  const c = o.getContext('2d');
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.save();
  c.translate(p.outW/2, p.outH/2);
  c.scale(p.sc, p.sc);
  c.drawImage(cv, -(p.b.x + p.b.w/2), -(p.b.y + p.b.h/2));
  c.restore();
  return o;
}

function updateInfo(){
  const el = $('#info');
  if(S.lines === 0){
    const b = exportBox();
    if(!b){ el.textContent = 'Canevas vide'; return; }
    const outH = S.targetW, outW = Math.round(b.w * outH / b.h);
    el.innerHTML = `Export <strong>${outW} × ${outH}</strong> px · icône seule, rognée`;
    return;
  }
  if(S.lines === 3 && !S.template){
    const b = exportBox();
    if(!b){ el.textContent = 'Canevas vide'; return; }
    const outW = S.targetW, outH = Math.round(b.h * outW / b.w);
    el.innerHTML = `Export <strong>${outW} × ${outH}</strong> px · texte seul`;
    return;
  }
  if(S.template){
    const p = templatePlan();
    if(!p){ el.textContent = 'Canevas vide'; return; }
    const suffix = p.bound === 'largeur'
      ? ' <span class="ratio-warn">· mot long : capitale réduite</span>'
      : p.bound === 'hauteur' ? ' · hauteur imposée par le gabarit' : '';
    el.innerHTML = `Export <strong>${p.outW} × ${p.outH}</strong> px · gabarit `
      + `<span class="ratio-ok">${S.ratio}:1</span> · capitale ${Math.round(p.capPx)} px` + suffix;
    return;
  }
  const b = exportBox();
  if(!b){ el.textContent = 'Canevas vide'; return; }
  const outW = S.targetW, outH = Math.round(b.h * outW / b.w);
  const r = b.w/b.h;
  const ok = r>=3 && r<=7;
  el.innerHTML = `Export <strong>${outW} × ${outH}</strong> px · ratio `
    + `<span class="${ok?'ratio-ok':'ratio-warn'}">${r.toFixed(2)}:1</span>`
    + (ok ? '' : ' <span class="ratio-warn">(hors 3:1 – 7:1)</span>');
}

function exportPNG(){
  render();
  let o, label;
  if(S.template && S.lines !== 0){
    o = renderTemplate();
    if(!o){ toast('Rien à exporter'); return; }
    label = `${o.width} × ${o.height} · gabarit ${S.ratio}:1`;
  } else {
    const b = exportBox();
    if(!b){ toast('Rien à exporter'); return; }
    let outW, outH;
    if(S.lines === 0){ outH = S.targetW; outW = Math.round(b.w * outH / b.h); }
    else { outW = S.targetW; outH = Math.round(b.h * outW / b.w); }
    o = document.createElement('canvas'); o.width=outW; o.height=outH;
    const c = o.getContext('2d');
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.drawImage(cv, b.x,b.y,b.w,b.h, 0,0,outW,outH);
    label = `${outW} × ${outH}`;
  }
  const base = S.lines === 0 ? (S.orn[0] ? S.orn[0].name : 'icone') : (S.line1+' '+(S.lines===2?S.sub:''));
  const name = base.trim().replace(/\s+/g,'-').replace(/[^\w\-À-ÿ]/g,'').toLowerCase() || 'clearart';
  const a = document.createElement('a');
  a.href = o.toDataURL('image/png');
  a.download = name+'.png';
  a.click();
  toast('PNG exporté — ' + label);
}
