<div class="stage-wrap">
  <div class="stage checker" id="stage"><canvas id="cv"></canvas></div>
  <div class="stage-bar">
    <div class="grow"></div>
    <div id="info">—</div>
  </div>
</div>

<div class="grid">
  <div class="card wide">
    <h3>Genre</h3>
    <div class="chips genres" id="genreChips"></div>
    <div class="ctrl">
      <label>Ou un thème libre</label>
      <div style="display:flex; gap:6px">
        <input type="text" id="themeInput" placeholder="braquage, vampire, volcan…">
        <button class="btn btn-sm" data-act="theme-go" style="flex:0 0 auto">Go</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Texte</h3>
    <div class="ctrl">
      <label>Nombre de lignes</label>
      <div class="toggle" id="lineToggle">
        <button class="active" data-lines="1">1 ligne</button>
        <button data-lines="2">2 lignes</button>
        <button data-lines="0">Icône seule</button>
        <button data-lines="3">Texte seul</button>
      </div>
    </div>
    <div class="ctrl" id="l1ctrl"><label id="l1lab">Libellé</label><input type="text" id="line1" data-bind="line1"></div>
    <div class="ctrl" id="l2ctrl" style="display:none"><label>Ligne 2</label><input type="text" id="sub" data-bind="sub"></div>
    <div class="ctrl"><label>Police</label>
      <button class="fontbtn" data-act="font-open">
        <span id="fontCur">Atma</span><span class="caret">▼</span>
      </button>
    </div>
    <div class="ctrl" id="l2fontctrl" style="display:none"><label>Police (ligne 2)</label>
      <button class="fontbtn" data-act="font-open-sub">
        <span id="fontCur2">Atma</span><span class="caret">▼</span>
      </button>
    </div>
    <div class="ctrl"><div class="row"><label>Taille</label><span class="sv" id="v-size"></span></div>
      <input type="range" id="size" data-bind="size" min="80" max="480" step="2"></div>
    <div class="ctrl"><div class="row"><label>Interlettrage</label><span class="sv" id="v-ls"></span></div>
      <input type="range" id="ls" data-bind="ls" min="-40" max="80"></div>
    <div class="ctrl"><div class="row"><label>Épaisseur</label><span class="sv" id="v-bold"></span></div>
      <input type="range" id="bold" data-bind="bold" min="0" max="30"></div>
    <div class="ctrl"><div class="row"><label>Échelle verticale</label><span class="sv" id="v-vscale"></span></div>
      <input type="range" id="vscale" data-bind="vscale" min="60" max="180"></div>
    <div id="subCtrl" style="display:none">
      <div class="ctrl"><div class="row"><label>Interligne</label><span class="sv" id="v-leading"></span></div>
        <input type="range" id="leading" data-bind="leading" min="60" max="160"></div>
      <div class="ctrl"><div class="row"><label>Taille du sous-titre</label><span class="sv" id="v-subScale"></span></div>
        <input type="range" id="subScale" data-bind="subScale" min="15" max="100"></div>
    </div>
  </div>

  <div class="card" id="iconCard">
    <h3>Icône</h3>
    <div class="ctrl"><div class="row"><label>Taille</label><span class="sv" id="v-iconPct"></span></div>
      <input type="range" id="iconPct" data-bind="iconPct" min="30" max="250"></div>
    <div class="ctrl"><div class="row"><label>Écart</label><span class="sv" id="v-gapPct"></span></div>
      <input type="range" id="gapPct" data-bind="gapPct" min="0" max="80"></div>
    <div class="ctrl"><div class="row"><label>Rotation</label><span class="sv" id="v-rot"></span></div>
      <input type="range" id="rot" data-bind="rot" min="-180" max="180"></div>
    <div class="ctrl"><div class="row"><label>Position horizontale</label><span class="sv" id="v-iconX"></span></div>
      <input type="range" id="iconX" data-bind="iconX" min="-100" max="100"></div>
    <button class="btn btn-sm" data-act="add" style="justify-content:center">🖼 Changer l'icône</button>
    <div class="note" id="ornNote">—</div>
    <div class="note">L'icône est centrée au-dessus du mot. Taille et écart s'expriment en pourcentage de la hauteur de capitale.</div>
    <button class="btn" data-act="reset-style" style="justify-content:center; width:100%; margin-top:8px">↺ Valeurs par défaut</button>
  </div>

  <div class="card">
    <h3>Export</h3>
    <label class="check"><input type="checkbox" id="template"> Gabarit uniforme</label>
    <div id="tplCtrl">
      <div class="ctrl"><div class="row"><label>Ratio du cadre</label><span class="sv" id="v-ratio"></span></div>
        <input type="range" id="ratio" data-bind="ratio" min="3" max="10" step="0.5"></div>
      <div class="ctrl"><div class="row"><label>Hauteur de capitale</label><span class="sv" id="v-capFrac"></span></div>
        <input type="range" id="capFrac" data-bind="capFrac" min="25" max="65"></div>
    </div>
    <div class="ctrl" id="marginCtrl" style="display:none"><div class="row"><label>Marge</label><span class="sv" id="v-margin"></span></div>
      <input type="range" id="margin" data-bind="margin" min="0" max="8"></div>
    <div class="ctrl"><label>Largeur cible (px)</label>
      <input type="number" id="targetW" data-bind="targetW" min="200" max="2000" step="10"></div>
    <button class="btn btn-gold" data-act="export" style="justify-content:center">⬇ Exporter le PNG</button>
  </div>
</div>

<input type="file" id="file" accept=".svg,.ai,image/*" multiple hidden>
<input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2" multiple hidden>

<div id="font-ov">
  <div id="fontbox">
    <div class="pick-head">
      <div class="ti">POLICES</div>
      <input type="text" id="fontSearch" placeholder="Rechercher une police…">
      <span id="fontCount" class="pick-count">—</span>
      <button class="m-close" data-act="font-close" title="Fermer — Échap">✕</button>
    </div>
    <div class="filt-bar">
      <label for="fontFilter">Filtre</label>
      <select class="filt" id="fontFilter"></select>
    </div>
    <div class="frows" id="fontRows"></div>
    <div class="pick-foot">
      <div class="note">1 899 familles Google Fonts (licences OFL / Apache), chargées à la demande — texte composé en majuscules. Vos polices importées sont conservées dans le navigateur.</div>
      <button class="btn btn-sm" data-act="font-import">📁 Importer une police…</button>
    </div>
  </div>
</div>

<div id="pick-ov">
  <div id="pick">
    <div class="pick-head">
      <div class="ti">BIBLIOTHÈQUE</div>
      <input type="text" id="pickSearch" placeholder="Rechercher en français ou en anglais : volcan, samouraï, katana…">
      <span id="pickCount" class="pick-count">—</span>
      <button class="m-close" data-act="pick-close" title="Fermer — Échap">✕</button>
    </div>
    <div class="filt-bar">
      <label for="pickCat">Mot-clé</label>
      <select class="filt" id="pickCat"></select>
    </div>
    <div class="pick-grid" id="pickGrid"></div>
    <div class="pick-foot">
      <div class="note">Recherche en ligne parmi ~200 000 icônes via <a href="https://iconify.design" target="_blank" rel="noopener">Iconify</a> (150 collections). Chaque collection a sa licence — le nom sous l'icône commence par celui de la collection. Créditez la source si vous diffusez vos clearart.</div>
      <button class="btn btn-sm" data-act="import">📁 Importer un SVG ou .ai…</button>
    </div>
  </div>
</div>

<div id="projOverlay" class="ov">
  <div class="mbox" style="max-width:680px">
    <div class="proj-head">
      <h3>🗂 GALERIE DE PROJETS</h3>
      <div style="flex:1"></div>
      <button class="m-close" data-act="proj-close" title="Fermer (Échap)">✕</button>
    </div>
    <div class="proj-save">
      <input type="text" id="projName" placeholder="Nom du projet…">
      <button class="pbtn pbtn-gold" data-act="proj-save">💾 Enregistrer le projet actuel</button>
      <button class="pbtn pbtn-indigo" data-act="proj-import">📂 Importer un .json</button>
    </div>
    <div class="mbody"><div class="proj-grid" id="projGrid"></div></div>
  </div>
</div>
<input type="file" id="projFile" accept=".json" hidden>

<div id="helpOverlay" class="ov">
  <div class="mbox">
    <div class="pick-head">
      <div class="ti">AIDE</div>
      <div style="flex:1"></div>
      <button class="m-close" data-act="help-close">✕</button>
    </div>
    <div class="mbody">
      <div class="help-tabs">
        <button class="help-tab active" data-htab="guide">AIDE</button>
        <button class="help-tab" data-htab="faq">FAQ</button>
        <button class="help-tab" data-htab="keys">Raccourcis</button>
      </div>

      <div id="htab-guide">
        <div class="help-li"><strong>Icône seule</strong> et <strong>Texte seul</strong> : les deux derniers boutons de « Nombre de lignes » masquent l'un ou l'autre. Icône seule centre le pictogramme sans texte ; Texte seul compose le libellé sans icône — un clearart purement typographique.</div>
        <div class="help-li"><strong>Genre</strong> : un clic applique une recette complète — police, icône, libellé. Les 18 genres cinématographiques classiques sont couverts.</div>
        <div class="help-li"><strong>Thème libre</strong> : tapez n'importe quel mot (braquage, vampire, volcan). Le dictionnaire français cherche l'icône ; la police vient du registre le plus proche.</div>
        <div class="help-li"><strong>Icône</strong> : recherche en ligne parmi ~200 000 icônes de 150 collections via <a href="https://iconify.design" target="_blank" rel="noopener">Iconify</a> — tapez en français, la requête est traduite automatiquement. Vous pouvez aussi glisser-déposer votre propre SVG, PNG, JPEG ou fichier vectoriel Illustrator (.ai) : un fond uni est détecté et retiré, et le dessin passe en blanc.</div>
        <div class="help-li"><strong>Police</strong> : 1 899 familles Google Fonts chargées à la demande, plus les vôtres — déposez un .ttf, .otf, .woff ou .woff2, il sera conservé dans le navigateur.</div>
        <div class="help-li"><strong>Gabarit uniforme</strong> (désactivé par défaut) : à cocher pour rendre une série homogène. Le cadre garde un ratio fixe et la hauteur de capitale est imposée ; les marges transparentes absorbent la différence de longueur des mots. À 5:1, les 18 genres sortent avec des lettres exactement de la même taille.</div>
        <div class="help-li"><strong>Export</strong> : PNG à fond transparent, blanc pur, rogné automatiquement sur les pixels non transparents.</div>
      </div>

      <div id="htab-faq" style="display:none">
        <details class="faq-q"><summary>Pourquoi mon mot est-il plus petit que les autres ?</summary>
          <div class="help-li">L'indicateur d'export le dit. « Hauteur imposée par le gabarit » est normal et identique pour tous. « Mot long : capitale réduite » signifie que ce libellé dépasse la largeur du cadre : élargissez le ratio, ou réduisez l'icône.</div></details>
        <details class="faq-q"><summary>Quelle taille d'image faut-il viser ?</summary>
          <div class="help-li">La plupart des médiathèques mettent le clearart à l'échelle pour tenir dans son emplacement : ce qui compte est le ratio et le rognage, pas la taille absolue. La largeur cible par défaut est de 2000 px, ce qui convient à la grande majorité des cas ; activez le gabarit uniforme si vous voulez un ratio fixe (5:1 par exemple) pour homogénéiser une série.</div></details>
        <details class="faq-q"><summary>Puis-je importer un logo en JPEG ?</summary>
          <div class="help-li">Oui. Un fond uni est détecté automatiquement, son seuil calculé par la méthode d'Otsu — ce qui résiste au bruit de compression — et le logo est détouré puis passé en blanc. Un logo noir sur blanc, ou l'inverse, fonctionne aussi bien.</div></details>
        <details class="faq-q"><summary>Le texte s'écrit toujours en majuscules ?</summary>
          <div class="help-li">Oui. Le texte est toujours composé en capitales : c'est le style visé pour un clearart, et cela évite les problèmes de rendu des minuscules sur certaines polices décoratives. La saisie est donc convertie automatiquement.</div></details>
        <details class="faq-q"><summary>Où sont stockés mes projets et mes polices ?</summary>
          <div class="help-li">Dans IndexedDB, la base locale du navigateur. Vider les données du site les efface : exportez vos projets en .json pour les conserver.</div></details>
        <details class="faq-q"><summary>Puis-je diffuser mes clearart ?</summary>
          <div class="help-li">Les icônes proviennent d'Iconify : chaque collection a sa propre licence, indiquée sur son dépôt. Les polices Google Fonts sont sous OFL ou Apache. Une police que vous importez garde sa propre licence — certaines sont réservées à l'usage personnel. Vérifiez avant diffusion.</div></details>
        <details class="faq-q"><summary>Où trouver d'autres polices ?</summary>
          <div class="help-li">Déposez n'importe quel <strong>.ttf, .otf, .woff ou .woff2</strong> sur la page, ou passez par le bouton du sélecteur. Quelques sources libres et fiables :
            <a href="https://fonts.google.com" target="_blank" rel="noopener">Google Fonts</a> (OFL, aussi accessible en ligne dans l'outil),
            <a href="https://www.dafont.com" target="_blank" rel="noopener">DaFont</a> (immense choix, vérifiez la licence indiquée par police),
            <a href="https://www.fontsquirrel.com" target="_blank" rel="noopener">Font Squirrel</a> (usage commercial vérifié),
            <a href="https://velvetyne.fr" target="_blank" rel="noopener">Velvetyne</a> et
            <a href="https://open-foundry.com" target="_blank" rel="noopener">Open Foundry</a> (fonderies libres, caractères marqués),
            <a href="https://fontesk.com" target="_blank" rel="noopener">Fontesk</a> et
            <a href="https://www.1001fonts.com" target="_blank" rel="noopener">1001 Fonts</a> (large choix, licence indiquée par police).
            Les archives .zip doivent être décompressées avant l'import.</div></details>
      </div>

      <div id="htab-keys" style="display:none">
        <div class="keys">
          <span><kbd>I</kbd> Bibliothèque d'icônes</span>
          <span><kbd>O</kbd> Choisir une police</span>
          <span><kbd>P</kbd> Projets</span>
          <span><kbd>F</kbd> Aperçu plein écran</span>
          <span><kbd>T</kbd> Thème clair / sombre</span>
          <span><kbd>E</kbd> Exporter le PNG</span>
          <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> Annuler</span>
          <span><kbd>Ctrl</kbd>+<kbd>Y</kbd> Rétablir</span>
          <span><kbd>?</kbd> Cette aide</span>
          <span><kbd>Échap</kbd> Fermer</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="previewOverlay">
  <img id="pvImg" alt="">
  <button class="m-close" data-act="preview" title="Fermer — Échap ou F">✕</button>
  <div class="pv-note" id="pvNote"></div>
</div>
`;

function renderGenreChips(){
  root.querySelector('#genreChips').innerHTML = GENRES.map((g,i)=>
    `<button class="chip" data-genre="${i}">${g[0]}</button>`).join('');
}

function setLines(n){
  S.lines = n;
  if(n !== 2){ S.sub = ''; const sub = root.querySelector('#sub'); if(sub) sub.value = ''; }
  root.querySelectorAll('#lineToggle button').forEach(b=>b.classList.toggle('active', +b.dataset.lines === n));
  const iconOnly = (n === 0);        // texte masqué, icône seule
  const textOnly = (n === 3);        // icône masquée, texte seul
  root.querySelector('#l1ctrl').style.display  = iconOnly ? 'none' : '';
  root.querySelector('#l2ctrl').style.display  = n === 2 ? '' : 'none';
  root.querySelector('#l2fontctrl').style.display = n === 2 ? '' : 'none';
  root.querySelector('#l1lab').textContent     = n === 2 ? 'Ligne 1' : 'Libellé';
  root.querySelector('#subCtrl').style.display = n === 2 ? '' : 'none';
  // Réglages de texte : inutiles en icône seule.
  ['size','ls','bold','vscale'].forEach(k=>{
    const el = root.querySelector('#'+k); if(el) el.closest('.ctrl').style.display = iconOnly ? 'none' : '';
  });
  // Réglages d'icône : inutiles en texte seul.
  ['iconPct','gapPct','rot','iconX'].forEach(k=>{
    const el = root.querySelector('#'+k); if(el) el.closest('.ctrl').style.display = textOnly ? 'none' : '';
  });
  const iconCard = root.querySelector('#iconCard');
  if(iconCard) iconCard.style.display = textOnly ? 'none' : '';
  inkCache.key = null;
}

function syncIconUI(){
  root.querySelector('#subCtrl').style.display = S.lines === 2 ? '' : 'none';
  const note = root.querySelector('#ornNote');
  note.textContent = S.orn.length ? S.orn[0].name.replace(/-/g,' ')
                                  : "Aucune icône. Choisissez un genre, ou cliquez « Changer l'icône ».";
}

function syncTemplateUI(){
  $('#tplCtrl').style.display    = S.template ? '' : 'none';
  $('#marginCtrl').style.display = S.template ? 'none' : '';
}
function syncLabels(){
  $('#v-ratio').textContent    = S.ratio+':1';
  $('#v-capFrac').textContent  = S.capFrac+'%';
  $('#v-iconPct').textContent  = S.iconPct+'%';
  $('#v-rot').textContent      = S.rot+'°';
  $('#v-iconX').textContent    = S.iconX+'%';
  $('#v-gapPct').textContent   = S.gapPct+'%';
  $('#v-subScale').textContent = S.subScale+'%';
  $('#v-size').textContent    = S.size+'px';
  $('#v-ls').textContent      = S.ls;
  $('#v-vscale').textContent  = S.vscale+'%';
  $('#v-leading').textContent = S.leading+'%';
  $('#v-bold').textContent    = S.bold;
  $('#v-margin').textContent  = S.margin+'%';
}

/* ─── Contrat de module ─── */
return {
  id:'clearart', name:'Clearart Maker', desc:'Logos de genres et de thèmes', needs:[],

  async mount(el){
    root = el; root.innerHTML = TPL;
    cv = $('#cv'); cv.width=W; cv.height=H; ctx = cv.getContext('2d', {willReadFrequently:true});

    scratch = document.createElement('canvas'); scratch.width=W; scratch.height=H;
    sctx = scratch.getContext('2d', {willReadFrequently:true});

    $('#fontCur').textContent = S.font;
    $('#fontCur2').textContent = S.subFont;
    $('#line1').value=S.line1; $('#sub').value=S.sub; $('#targetW').value=S.targetW;
    setLines(S.lines);
    ['size','ls','vscale','leading','bold','margin','iconPct','gapPct','iconX','subScale','ratio','capFrac','rot'].forEach(k=> $('#'+k).value = S[k]);
    $('#template').checked = S.template;
    renderGenreChips(); syncIconUI(); syncTemplateUI(); syncLabels();

    // liaisons génériques
    root.addEventListener('input', e=>{
      if(e.target.id==='pickSearch' || e.target.id==='fontSearch') return;
      const k = e.target.dataset.bind;
      if(k){
        if(k==='line1' || k==='sub'){
          // Les polices sont subsettées aux capitales : une minuscule tomberait en repli.
          const up = e.target.value.toUpperCase();
          if(up !== e.target.value){
            const pos = e.target.selectionStart;
            e.target.value = up;
            try{ e.target.setSelectionRange(pos, pos); }catch(err){}
          }
          S[k] = up;
          inkCache.key = null;
        } else {
          S[k] = e.target.type==='text' ? e.target.value : +e.target.value;
        }
        syncLabels();
        scheduleRender(); return;
      }
    });
    root.addEventListener('change', async e=>{
      if(e.target.dataset.bind || e.target.id==='template') commit();
      if(e.target.id==='template'){ S.template = e.target.checked; syncTemplateUI(); scheduleRender(); }
      if(e.target.id==='pickCat'){
        pickQ = e.target.value;
        root.querySelector('#pickSearch').value = pickQ;
        renderIconify();
      }
      if(e.target.id==='projFile'){ importProjectFile(e); }
      if(e.target.id==='fontFilter'){
        fontTheme = e.target.value; fontQ = '';
        root.querySelector('#fontSearch').value = '';
        renderFontRows();
      }
      if(e.target.id==='file'){ for(const f of e.target.files) await addOrnamentFile(f); e.target.value=''; }
      if(e.target.id==='fontFile'){
        for(const f of e.target.files) await addFontFile(f);
        e.target.value='';
        renderFontChips(); renderFontRows();
      }
    });

    // délégation des actions
    root.addEventListener('click', e=>{
      const del = e.target.closest('[data-fdel]');
      if(del){
        e.stopPropagation();
        const f = del.dataset.fdel;
        dropFont(f).then(()=>{
          if(S.font === f){ fontTarget='font'; chooseFont('Atma'); }
          if(S.subFont === f){ fontTarget='subFont'; chooseFont('Atma'); }
          renderFontChips(); renderFontRows(); toast('Police retirée');
        });
        return;
      }
      const b = e.target.closest('[data-act],[data-ico],[data-lines],[data-font],[data-genre],[data-htab],[data-pload],[data-pupd],[data-pexp],[data-pdel]');
      if(!b) return;
      if(b.dataset.act==='add')        openPicker();
      if(b.dataset.act==='pick-close') closePicker();
      if(b.dataset.act==='import')     $('#file').click();
      if(b.dataset.act==='export')     exportPNG();
      if(b.dataset.act==='font-open')  openFontPicker('font');
      if(b.dataset.act==='font-open-sub') openFontPicker('subFont');
      if(b.dataset.act==='font-close') closeFontPicker();
      if(b.dataset.act==='font-import') $('#fontFile').click();
      if(b.dataset.act==='undo')         undo();
      if(b.dataset.act==='redo')         redo();
      if(b.dataset.act==='theme')       toggleTheme();
      if(b.dataset.act==='proj')        openProjects();
      if(b.dataset.act==='proj-close')  closeProjects();
      if(b.dataset.act==='proj-save')   saveProject();
      if(b.dataset.act==='proj-import') $('#projFile').click();
      if(b.dataset.pload) projGet(b.dataset.pload).then(p=>{ applyProject(p); closeProjects(); });
      if(b.dataset.pupd)  updateProject(b.dataset.pupd);
      if(b.dataset.pexp)  projGet(b.dataset.pexp).then(p=>{ downloadJSON(p, p.name); toast('Projet exporté'); });
      if(b.dataset.pdel){
        const id = b.dataset.pdel;
        projGet(id).then(p=>{
          if(p && confirm(`Supprimer « ${p.name} » ?`))
            projDel(id).then(()=>{ renderProjects(); toast('Projet supprimé'); });
        });
      }
      if(b.dataset.act==='preview')     togglePreview();
      if(b.dataset.act==='help')        document.getElementById('helpOverlay').classList.add('open');
      if(b.dataset.act==='help-close')  document.getElementById('helpOverlay').classList.remove('open');
      if(b.dataset.htab){
        root.querySelectorAll('.help-tab').forEach(x=>x.classList.toggle('active', x===b));
        ['guide','faq','keys'].forEach(t=>{
          root.querySelector('#htab-'+t).style.display = (t===b.dataset.htab) ? '' : 'none';
        });
      }
      if(b.dataset.font)  chooseFont(b.dataset.font);
      if(b.dataset.ico) addIconifyIcon(b.dataset.ico);
      if(b.dataset.lines){ setLines(+b.dataset.lines); scheduleRender(); commit(); }
      if(b.dataset.genre !== undefined) applyGenre(+b.dataset.genre);
      if(b.dataset.act==='theme-go') applyTheme($('#themeInput').value);
      if(b.dataset.act==='reset-style') resetStyleDefaults();
    });

    root.querySelector('#pick-ov').addEventListener('click', e=>{ if(e.target.id==='pick-ov') closePicker(); });
    root.querySelector('#font-ov').addEventListener('click', e=>{ if(e.target.id==='font-ov') closeFontPicker(); });
    root.querySelector('#helpOverlay').addEventListener('click', e=>{ if(e.target.id==='helpOverlay') e.currentTarget.classList.remove('open'); });
    root.querySelector('#projOverlay').addEventListener('click', e=>{ if(e.target.id==='projOverlay') closeProjects(); });
    root.querySelector('#previewOverlay').addEventListener('click', e=>{ if(e.target.id==='previewOverlay') e.currentTarget.classList.remove('open'); });

    ['undoBtn','redoBtn'].forEach(id=>{
      document.getElementById(id).addEventListener('click', ()=> id==='undoBtn' ? undo() : redo());
    });

    root.querySelector('#projName').addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); saveProject(); }
    });
    root.querySelector('#themeInput').addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); applyTheme(e.target.value); }
    });

    let fontT = null;
    root.querySelector('#fontSearch').addEventListener('input', e=>{
      fontQ = e.target.value.trim();
      clearTimeout(fontT); fontT = setTimeout(renderFontRows, 130);
    });
    let pickT = null;
    root.querySelector('#pickSearch').addEventListener('input', e=>{
      pickQ = e.target.value;
      const sel = root.querySelector('#pickCat');
      const k = deburr(pickQ);
      sel.value = Object.prototype.hasOwnProperty.call(FR, k) ? k : '';
      clearTimeout(pickT); pickT = setTimeout(renderIconify, 320);
    });

    // glisser-déposer
    const dz = document.getElementById('drop');
    let depth=0;
    const files = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
    window.addEventListener('dragenter', e=>{ if(files(e)){ e.preventDefault(); depth++; dz.classList.add('on'); }});
    window.addEventListener('dragover',  e=>{ if(files(e)){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; }});
    window.addEventListener('dragleave', e=>{ if(files(e) && !--depth) dz.classList.remove('on'); });
    window.addEventListener('drop', async e=>{
      if(!files(e)) return;
      e.preventDefault(); depth=0; dz.classList.remove('on');
      let fonts = 0;
      for(const f of e.dataTransfer.files){
        if(isFontFile(f)){ await addFontFile(f); fonts++; }
        else await addOrnamentFile(f);
      }
      if(fonts){ renderFontChips(); renderFontRows(); }
    });

    applyStoredTheme();
    try{ await loadStoredFonts(); }catch(e){ console.error(e); }
    try{ await loadFont(S.font);  }catch(e){ console.error(e); }
    try{ await loadFont(S.subFont); }catch(e){ console.error(e); }
    try{
      const img = await decodeURL(DEFAULT_ICON);
      addOrnament(imgToCanvas(img), 'raton laveur');
    }catch(e){ console.error(e); }
    syncIconUI();
    render();
    CUR = snapshot(); histUI();
  },

  activate(){ scheduleRender(); },
  deactivate(){ if(raf) cancelAnimationFrame(raf); },

  onKey(e){
    const help = document.getElementById('helpOverlay');
    const prev = document.getElementById('previewOverlay');
    if(e.key === 'Escape'){
      for(const el of [prev, help, root.querySelector('#projOverlay'), root.querySelector('#font-ov'), root.querySelector('#pick-ov')]){
        if(el.classList.contains('open')){ el.classList.remove('open'); return true; }
      }
      return false;
    }
    if(e.ctrlKey || e.metaKey){
      const k = e.key.toLowerCase();
      if(k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); return true; }
      if(k === 'y' || (k === 'z' && e.shiftKey)){ e.preventDefault(); redo(); return true; }
      return false;
    }
    if(e.altKey) return false;
    switch(e.key.toLowerCase()){
      case 'i': e.preventDefault(); openPicker();     return true;
      case 'o': e.preventDefault(); openFontPicker(); return true;
      case 'p': e.preventDefault(); openProjects();   return true;
      case 'f': e.preventDefault(); togglePreview();  return true;
      case 't': e.preventDefault(); toggleTheme();    return true;
      case 'e': e.preventDefault(); exportPNG();      return true;
      case '?': e.preventDefault(); help.classList.add('open'); return true;
    }
    return false;
  }
};
})();

/* Autonome aujourd'hui, module du hub demain — le contrat ne change pas. */
if(window.JukeBox) window.JukeBox.register(ClearartMaker);
else {
  ClearartMaker.mount(document.getElementById('app-clearart'));
  document.addEventListener('keydown', e=>{
    const t = (e.target.tagName||'').toLowerCase();
    const typing = (t==='input' || t==='select' || t==='textarea');
    if(typing && !(e.ctrlKey || e.metaKey)) return;   // Ctrl+Z reste actif dans un champ
    ClearartMaker.onKey(e);
  });
}
</script>
